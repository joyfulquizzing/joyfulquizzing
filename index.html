<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyful Quizzing - Links</title>
    <style>
        /* @import скачивает красивый шрифт Montserrat */
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');

        /* Обнуляем отступы */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Montserrat', 'Segoe UI', sans-serif;
        }

        /* Настраиваем фон всего сайта (ваш оригинальный фон с картой мира) */
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background-color: #050814;
            background-image: url('image_16.png'); 
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            position: relative;
        }

        /* Полупрозрачная маска поверх фона для читаемости */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background-color: rgba(5, 8, 20, 0.7);
            z-index: 1;
        }

        /* Ограничиваем контейнер под мобильный экран */
        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
            z-index: 2;
            padding: 50px 20px;
        }

        /* Увеличенный контейнер для логотипа (теперь он во всю ширину контента) */
        .profile-logo-container {
            width: 85%; /* Увеличили, чтобы края были практически на уровне кнопок */
            max-width: 320px;
            margin-bottom: 25px;
            /* Мягкое неоновое свечение вокруг твоего лого */
            filter: drop-shadow(0px 10px 25px rgba(90, 84, 255, 0.5));
        }

        /* Сама картинка логотипа */
        .profile-logo {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Новый обновленный слоган */
        .bio {
            font-size: 16px;
            color: #e2e5f0;
            margin-bottom: 40px;
            line-height: 1.5;
            font-weight: 600; /* Сделали чуть жирнее и отчетливее */
            text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
        }

        /* Блок с кнопками-ссылками */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px; /* Чуть увеличили расстояние для воздушности */
        }

        /* Фирменный стиль твоих кнопок */
        .link-btn {
            width: 100%;
            background: #5A54FF;
            color: #ffffff;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 20px; /* Идеальное скругление как на твоем скришоте */
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        /* Контейнер для иконки внутри кнопки */
        .btn-icon {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Стили самих SVG иконок */
        .btn-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        /* Текст внутри кнопки */
        .btn-text {
            flex-grow: 1;
            text-align: center;
            margin-right: 24px; /* Идеальная центровка */
        }

        /* Эффект при наведении/нажатии на кнопку */
        .link-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: #6B66FF;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            border-color: #00F2FE; 
        }

        /* Обновленный информационный подвал */
        footer {
            margin-top: 60px;
            font-size: 13px;
            font-weight: 600;
            color: #6C7493; /* Приятный приглушенный цвет */
            letter-spacing: 1px; /* Красивый отступ между буквами */
            text-transform: uppercase; /* Все буквы заглавные для стиля */
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- Блок твоего увеличенного логотипа -->
        <div class="profile-logo-container">
            <img src="logo.svg" alt="Joyful Quizzing" class="profile-logo">
        </div>

        <!-- Новый слоган -->
        <p class="bio">Smart quizzes for curious minds 🧠</p>

        <!-- Кнопки соцсетей -->
        <div class="links-wrapper">
            
            <!-- Facebook -->
            <a href="#" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="fb.svg" alt="Facebook"></span>
                <span class="btn-text">Find us on Facebook</span>
            </a>
            
            <!-- Instagram -->
            <a href="#" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="ig.svg" alt="Instagram"></span>
                <span class="btn-text">Follow on Instagram</span>
            </a>
            
            <!-- TikTok -->
            <a href="#" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="tt.svg" alt="TikTok"></span>
                <span class="btn-text">Watch on TikTok</span>
            </a>
            
            <!-- Snapchat -->
            <a href="#" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="sc.svg" alt="Snapchat"></span>
                <span class="btn-text">Check out Snapchat</span>
            </a>

        </div>

        <!-- Обновленный текст подвала -->
        <footer>
            Geography • History • More Coming Soon
        </footer>
    </div>

</body>
</html>
