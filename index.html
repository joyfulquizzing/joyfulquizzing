<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-078L9T7WHE"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-078L9T7WHE');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyful Quizzing - Explore & Learn</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        @import url('https://api.fontshare.com/v2/css?f[]=satoshi@700,900,600,500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: radial-gradient(circle at top left, #22105B 0%, #08122C 35%, #03091A 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 24px;
        }

        .profile-logo-container {
            width: 90px; 
            height: 90px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 0px 30px rgba(124, 77, 255, 0.8));
        }

        .profile-logo {
            width: 100%;
            height: auto;
            display: block;
        }

        .brand-title {
            font-family: 'Satoshi', sans-serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
            color: #ffffff;
        }

        .brand-title span {
            color: #6C63FF;
        }

        .bio {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px; 
            color: #ffffff;
            margin-bottom: 25px;
            font-weight: 500; 
        }

        .features-badge {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 35px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #ffffff;
        }

        .feature-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
            background: linear-gradient(90deg, #7C4DFF, #9C4DFF);
            -webkit-mask-repeat: no-repeat;
            mask-repeat: no-repeat;
            -webkit-mask-size: contain;
            mask-size: contain;
            -webkit-mask-position: center;
            mask-position: center;
        }

        .feature-icon-1 {
            -webkit-mask-image: url('5p.svg');
            mask-image: url('5p.svg');
        }

        .feature-icon-2 {
            -webkit-mask-image: url('nqd.svg');
            mask-image: url('nqd.svg');
        }

        .divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
        }

        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px; 
            margin-bottom: 40px;
        }

        .link-btn {
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            color: #ffffff;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 16px; 
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            
            border: 1px solid transparent;
            background-image: linear-gradient(#07142D, #07142D), 
                              linear-gradient(90deg, #7C4DFF, #9C4DFF);
            background-origin: border-box;
            background-clip: padding-box, border-box;

            box-shadow: inset 0 0 10px rgba(124, 77, 255, 0.25);
                
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .btn-left {
            display: flex;
            align-items: center;
        }

        .btn-icon {
            width: 28px;
            height: 28px;
            margin-right: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-text {
            color: #ffffff;
        }

        .btn-arrow {
            width: 8px;
            height: 8px;
            border-top: 2px solid #7C4DFF;
            border-right: 2px solid #7C4DFF;
            transform: rotate(45deg);
            transition: transform 0.25s ease, border-color 0.25s ease;
            margin-right: 4px;
        }

        .link-btn:hover {
            background-image: linear-gradient(#0c1d3d, #0c1d3d), 
                              linear-gradient(90deg, #8c61ff, #ac61ff);
            box-shadow: inset 0 0 14px rgba(124, 77, 255, 0.4);
        }

        .link-btn:hover .btn-arrow {
            transform: translate(3px, 0) rotate(45deg);
            border-color: #3DD6D0;
        }

        .link-btn:active {
            transform: scale(0.99);
        }

        .footer-line-divider {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            opacity: 0.2;
        }

        .line {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, transparent, #6C63FF, transparent);
        }

        .diamond {
            font-size: 10px;
            color: #6C63FF;
        }

        footer {
            font-family: 'Montserrat', sans-serif;
            font-size: 14px;
            font-weight: 600;
            color: #6C63FF;
            letter-spacing: 0.3px; 
        }

        footer .highlight {
            color: #3DD6D0;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-logo-container">
            <img src="logo.svg" alt="JQ" class="profile-logo">
        </div>

        <h1 class="brand-title">Joyful <span>Quizzing</span></h1>

        <p class="bio">Smart quizzes for curious minds 🧠</p>

        <div class="features-badge">
            <div class="feature-item">
                <span class="feature-icon feature-icon-1"></span>
                <span>5 Platforms</span>
            </div>
            <div class="divider"></div>
            <div class="feature-item">
                <span class="feature-icon feature-icon-2"></span>
                <span>New Quizzes Daily</span>
            </div>
        </div>

        <div class="links-wrapper">
            
            <a href="https://www.youtube.com/@joyfulquizzing/shorts" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="yt.svg" alt="YouTube"></span>
                    <span class="btn-text">Watch on YouTube</span>
                </div>
                <span class="btn-arrow"></span>
            </a>

            <a href="https://www.tiktok.com/@joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="tt.svg" alt="TikTok"></span>
                    <span class="btn-text">Watch on TikTok</span>
                </div>
                <span class="btn-arrow"></span>
            </a>
            
            <a href="https://www.instagram.com/joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="ig.svg" alt="Instagram"></span>
                    <span class="btn-text">Follow on Instagram</span>
                </div>
                <span class="btn-arrow"></span>
            </a>
            
            <a href="https://www.facebook.com/joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="fb.svg" alt="Facebook"></span>
                    <span class="btn-text">Find us on Facebook</span>
                </div>
                <span class="btn-arrow"></span>
            </a>
            
            <a href="https://www.snapchat.com/add/joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="sc.svg" alt="Snapchat"></span>
                    <span class="btn-text">Check out Snapchat</span>
                </div>
                <span class="btn-arrow"></span>
            </a>

        </div>

        <div class="footer-line-divider">
            <div class="line"></div>
            <span class="diamond">✦</span>
            <div class="line"></div>
        </div>

        <footer>
            Explore. <span class="highlight">Learn.</span> Challenge Yourself.
        </footer>
    </div>

</body>
</html>
