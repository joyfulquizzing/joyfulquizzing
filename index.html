<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyful Quizzing - Links</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap');
        @import url('https://api.fontshare.com/v2/css?f[]=satoshi@700,900,600&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            background: linear-gradient(135deg, #0b0d1b 0%, #050814 50%, #020308 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 60px 20px;
        }

        .profile-logo-container {
            width: 85%; 
            max-width: 320px;
            margin-bottom: 25px;
            filter: drop-shadow(0px 12px 30px rgba(90, 84, 255, 0.45));
        }

        .profile-logo {
            width: 100%;
            height: auto;
            display: block;
        }

        .bio {
            font-family: 'Satoshi', sans-serif;
            font-size: 18px; 
            color: #e2e5f0;
            margin-bottom: 40px;
            line-height: 1.4;
            font-weight: 600; 
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 18px; 
        }

        .link-btn {
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            background: #5A54FF;
            color: #ffffff;
            padding: 18px 24px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 20px; 
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            display: flex;
            align-items: center;
            justify-content: flex-start;
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
        }

        .btn-icon {
            width: 24px;
            height: 24px;
            margin-right: 16px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-text {
            flex-grow: 1;
            text-align: center;
            margin-right: 24px; 
        }

        .link-btn:hover {
            transform: translateY(-2px) scale(1.02);
            background: #6B66FF;
            box-shadow: 0 0 25px rgba(0, 242, 254, 0.6);
            border-color: #00F2FE; 
        }

        footer {
            font-family: 'Montserrat', sans-serif;
            margin-top: 60px;
            font-size: 12px;
            font-weight: 600;
            color: #6C7493; 
            letter-spacing: 1.5px; 
            text-transform: uppercase; 
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-logo-container">
            <img src="logo.svg" alt="Joyful Quizzing" class="profile-logo">
        </div>

        <p class="bio">Smart quizzes for curious minds 🧠</p>

        <div class="links-wrapper">
            
            <a href="https://www.tiktok.com/@joyfulquizzing" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="tt.svg" alt="TikTok"></span>
                <span class="btn-text">Watch on TikTok</span>
            </a>

            <a href="https://www.youtube.com/@joyfulquizzing/shorts" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="yt.svg" alt="YouTube"></span>
                <span class="btn-text">Watch on YouTube</span>
            </a>
            
            <a href="https://www.instagram.com/joyfulquizzing" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="ig.svg" alt="Instagram"></span>
                <span class="btn-text">Follow on Instagram</span>
            </a>
            
            <a href="https://www.facebook.com/joyfulquizzing" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="fb.svg" alt="Facebook"></span>
                <span class="btn-text">Find us on Facebook</span>
            </a>
            
            <a href="https://www.snapchat.com/add/joyfulquizzing" target="_blank" class="link-btn">
                <span class="btn-icon"><img src="sc.svg" alt="Snapchat"></span>
                <span class="btn-text">Check out Snapchat</span>
            </a>

        </div>

        <footer>
            Geography • History • More Coming Soon
        </footer>
    </div>

</body>
</html>
