<!DOCTYPE html>
<html lang="en">
<head>
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-XXXXXXXXXX"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());

      gtag('config', 'G-XXXXXXXXXX');
    </script>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Joyful Quizzing - Explore & Learn</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap');
        @import url('https://api.fontshare.com/v2/css?f[]=satoshi@700,900,600,500&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            /* Сложный градиент, имитирующий свечение сбоку как на дизайне */
            background: 
                radial-gradient(circle at 90% 50%, rgba(0, 242, 254, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 10% 10%, rgba(90, 84, 255, 0.12) 0%, transparent 50%),
                linear-gradient(180deg, #070913 0%, #03050c 50%, #010205 100%);
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            width: 100%;
            max-width: 430px;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 50px 24px;
        }

        /* Только иконка JQ без текста */
        .profile-logo-container {
            width: 90px; 
            height: 90px;
            margin-bottom: 20px;
            filter: drop-shadow(0px 10px 25px rgba(90, 84, 255, 0.5));
        }

        .profile-logo {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Текстовое название шрифтом Satoshi */
        .brand-title {
            font-family: 'Satoshi', sans-serif;
            font-size: 36px;
            font-weight: 900;
            letter-spacing: -0.5px;
            margin-bottom: 12px;
        }

        .brand-title span {
            background: linear-gradient(90deg, #7F7BFF, #A29FFF);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .bio {
            font-family: 'Montserrat', sans-serif;
            font-size: 16px; 
            color: #bcbfc8;
            margin-bottom: 25px;
            font-weight: 500; 
        }

        /* Блок характеристик проекта (5 Platforms | New Quizzes Daily) */
        .features-badge {
            font-family: 'Montserrat', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 10px 20px;
            border-radius: 30px;
            margin-bottom: 35px;
        }

        .feature-item {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 13px;
            font-weight: 600;
            color: #e2e5f0;
        }

        .feature-icon {
            width: 18px;
            height: 18px;
            display: flex;
            align-items: center;
        }

        .feature-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .divider {
            width: 1px;
            height: 16px;
            background: rgba(255, 255, 255, 0.15);
        }

        /* Список кнопок */
        .links-wrapper {
            width: 100%;
            display: flex;
            flex-direction: column;
            gap: 14px; 
            margin-bottom: 40px;
        }

        /* Стиль кнопок из дизайна (Стекломорфизм + Тонкий контур) */
        .link-btn {
            font-family: 'Montserrat', sans-serif;
            width: 100%;
            background: rgba(13, 16, 37, 0.6);
            color: #ffffff;
            padding: 16px 20px;
            font-size: 15px;
            font-weight: 600;
            text-decoration: none;
            border-radius: 14px; 
            transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            align-items: center;
            justify-content: space-between;
            border: 1px solid rgba(90, 84, 255, 0.35);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
        }

        .btn-left {
            display: flex;
            align-items: center;
        }

        .btn-icon {
            width: 28px;
            height: 28px;
            margin-right: 14px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .btn-icon img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .btn-text {
            color: #f0f2f8;
        }

        /* Стрелочка вправо как на дизайне */
        .btn-arrow {
            color: rgba(90, 84, 255, 0.8);
            font-size: 16px;
            font-weight: 400;
            transition: transform 0.3s ease;
        }

        /* Эффект наведения как на дизайне */
        .link-btn:hover {
            transform: translateY(-1px);
            background: rgba(20, 24, 56, 0.8);
            border-color: #5A54FF; 
            box-shadow: 0 0 20px rgba(90, 84, 255, 0.35);
        }

        .link-btn:hover .btn-arrow {
            transform: translateX(3px);
            color: #00F2FE;
        }

        /* Декоративный разделитель перед подвалом */
        .footer-line-divider {
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            opacity: 0.3;
        }

        .line {
            height: 1px;
            flex-grow: 1;
            background: linear-gradient(90deg, transparent, #ffffff, transparent);
        }

        .diamond {
            font-size: 10px;
            color: #ffffff;
        }

        /* Новый подвал-философия */
        footer {
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            font-weight: 600;
            color: #6C7493; 
            letter-spacing: 0.5px; 
        }

        footer .highlight {
            color: #00F2FE; /* Фирменный бирюзовый */
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-logo-container">
            <img src="logo.svg" alt="JQ" class="profile-logo">
        </div>

        <h1 class="brand-title">Joyful <span>Quizzing</span></h1>

        <p class="bio">Smart quizzes for curious minds 🧠</p>

        <div class="features-badge">
            <div class="feature-item">
                <span class="feature-icon"><img src="5p.svg" alt="Platforms"></span>
                <span>5 Platforms</span>
            </div>
            <div class="divider"></div>
            <div class="feature-item">
                <span class="feature-icon"><img src="nqd.svg" alt="Daily"></span>
                <span>New Quizzes Daily</span>
            </div>
        </div>

        <div class="links-wrapper">
            
            <a href="https://www.youtube.com/@joyfulquizzing/shorts" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="yt.svg" alt="YouTube"></span>
                    <span class="btn-text">Watch on YouTube</span>
                </div>
                <span class="btn-arrow">&gt;</span>
            </a>

            <a href="https://www.tiktok.com/@joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="tt.svg" alt="TikTok"></span>
                    <span class="btn-text">Watch on TikTok</span>
                </div>
                <span class="btn-arrow">&gt;</span>
            </a>
            
            <a href="https://www.instagram.com/joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="ig.svg" alt="Instagram"></span>
                    <span class="btn-text">Follow on Instagram</span>
                </div>
                <span class="btn-arrow">&gt;</span>
            </a>
            
            <a href="https://www.facebook.com/joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="fb.svg" alt="Facebook"></span>
                    <span class="btn-text">Find us on Facebook</span>
                </div>
                <span class="btn-arrow">&gt;</span>
            </a>
            
            <a href="https://www.snapchat.com/add/joyfulquizzing" target="_blank" class="link-btn">
                <div class="btn-left">
                    <span class="btn-icon"><img src="sc.svg" alt="Snapchat"></span>
                    <span class="btn-text">Check out Snapchat</span>
                </div>
                <span class="btn-arrow">&gt;</span>
            </a>

        </div>

        <div class="footer-line-divider">
            <div class="line"></div>
            <span class="diamond">✦</span>
            <div class="line"></div>
        </div>

        <footer>
            Explore. <span class="highlight">Learn.</span> Challenge Yourself.
        </footer>
    </div>

</body>
</html>
